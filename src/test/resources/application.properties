spring.datasource.url=jdbc:h2:mem:blog_system_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 多测试类共享同一 H2 内存库，每个上下文启动都会执行 schema.sql/data.sql，语句均为幂等写法
spring.sql.init.mode=always
spring.data.redis.database=0
spring.ai.vectorstore.elasticsearch.index-name=spring-ai-document-index-test
