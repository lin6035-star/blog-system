# 生产环境配置
# 启动方式：./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
#   或：java -jar blog-system.jar --spring.profiles.active=prod
#
# 需要设置环境变量：
#   DB_PASSWORD        — MySQL 密码
#   JWT_SECRET         — JWT 签名密钥（至少 32 字符随机字符串）
#   OSS_ACCESS_KEY_ID  — 阿里云 OSS AccessKey（可选，不上传文件可不设）
#   OSS_ACCESS_KEY_SECRET — 阿里云 OSS SecretKey（可选）

server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog_system?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: myRoot
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  type-aliases-package: com.hailin.blogsystem.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl  # 生产关掉 SQL 日志

jwt:
  secret: ${JWT_SECRET}

aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: blog-system-26
    region: cn-beijing
